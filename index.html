<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Private daily football slips.">
<meta name="theme-color" content="#f3f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1310" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Matchday">
<title>Matchday</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="icons/icon-192.png" alt="" width="32" height="32">
      <div class="brand-text">
        <div class="brand-name">Matchday</div>
        <div class="brand-sub" id="subtitle"></div>
      </div>
    </div>
    <button class="icon-btn" id="refresh" type="button" aria-label="Check for new slips" hidden></button>
  </header>
  <main class="view" id="view" tabindex="-1">
    <noscript><section class="card"><p>Matchday needs JavaScript.</p></section></noscript>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Sections" hidden></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</body>
</html>
